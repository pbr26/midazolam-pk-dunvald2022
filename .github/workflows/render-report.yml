name: Render and publish report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  render-report:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      # Step 3: Install Quarto CLI
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Step 4: Install system dependencies (needed for some R packages)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      # Step 5: Restore renv package library from lockfile
      # This installs the exact package versions you locked with renv::snapshot()
      - name: Restore renv library
        uses: r-lib/actions/setup-renv@v2

      # Step 6: Run all analysis scripts in order
      - name: Run analysis scripts
        run: |
          Rscript R/01_load_data.R
          Rscript R/02_descriptive_stats.R
          Rscript R/03_pk_plots.R
          Rscript R/04_nca_ncappc.R
          Rscript R/05_gmr_testing.R
          Rscript R/06_sample_size.R

      # Step 7: Render the Quarto report
      - name: Render Quarto report
        run: quarto render report/dunvald2022_reproduction.qmd --output-dir docs

      # Step 8: Deploy docs/ folder to GitHub Pages
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
